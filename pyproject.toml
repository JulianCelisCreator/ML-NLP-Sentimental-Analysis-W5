[project]
name = "ml-npl-workshop5"
version = "0.1.0"
description = "Team 4 — Workshop #5: GANs over RoBERTa review embeddings. Machine Learning 2026-III, Universidad Distrital."
authors = [
    {name = "JulianCelisCreator",email = "celisjuliandavid@gmail.com"}
]
requires-python = ">=3.12,!=3.14.1,<3.15"
dependencies = [
    "torch (>=2.15.0,<3.0.0)",
    "numpy (>=2.0.0,<3.0.0)",
    "scipy (>=1.14.0,<2.0.0)",
    "scikit-learn (>=1.6.0,<2.0.0)",
    "pandas (>=2.2.0,<4.0.0)",
    "pyarrow (>=18.0.0,<30.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "joblib (>=1.4.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

# The GANs are small fully-connected networks over 768-d vectors: the CPU build of torch
# trains every model in minutes and keeps the install at ~1 GB.
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
